apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      # imagePullSecrets is used for private registries.
      # Create the secret with:
      #   kubectl create secret docker-registry regcred \
      #     --docker-server=<registry> --docker-username=<user> --docker-password=<pass>
      # Then reference it in your Kustomize overlay:
      #   imagePullSecrets:
      #     - name: regcred
      initContainers:
        - name: migrate
          image: stellaredupay/backend:placeholder
          imagePullPolicy: IfNotPresent
          command: ["npm", "run", "migrate"]
          env:
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: stellaredupay
                  key: MONGO_URI
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
      containers:
        - name: backend
          image: stellaredupay/backend:placeholder
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: stellaredupay
                  key: JWT_SECRET
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: stellaredupay
                  key: MONGO_URI
            - name: REDIS_HOST
              value: "redis"
            # Email bounce/complaint webhook authentication (issue #1537).
            # Optional keys — in production the webhook rejects every call
            # unless at least one of them is present in the secret.
            - name: EMAIL_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: stellaredupay
                  key: EMAIL_WEBHOOK_SECRET
                  optional: true
            - name: EMAIL_SNS_TOPIC_ARNS
              valueFrom:
                secretKeyRef:
                  name: stellaredupay
                  key: EMAIL_SNS_TOPIC_ARNS
                  optional: true
            - name: EMAIL_SENDGRID_WEBHOOK_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: stellaredupay
                  key: EMAIL_SENDGRID_WEBHOOK_PUBLIC_KEY
                  optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
